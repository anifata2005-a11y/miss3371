<!DOCTYPE html>
<html>
<head>
    <title>We Care Medical Clinic</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>

<!-- HEADER -->
<div id="header">
    <img src="we-care-medical-clinic.png" class="logo">
    <h1>We Care Medical Clinic</h1>
    <h2 id="welcome">Loading...</h2>

    <nav>
        <a href="index.html">Home</a> |
        <a href="resources.html">Resources</a>
    </nav>
</div>

<!-- FORM -->
<div id="form-section">

<form onsubmit="return validateAll()">

    <fieldset>
        <legend>Personal Information</legend>

        First Name:
        <input type="text" id="firstName" onblur="validateName('firstName','errFirst')">
        <span class="error" id="errFirst"></span><br><br>

        Middle Initial:
        <input type="text" id="mi" maxlength="1" onblur="validateMI()">
        <span class="error" id="errMI"></span><br><br>

        Last Name:
        <input type="text" id="lastName" onblur="validateName('lastName','errLast')">
        <span class="error" id="errLast"></span><br><br>

        DOB:
        <input type="date" id="dob" onblur="validateDOB()">
        <span class="error" id="errDOB"></span>
    </fieldset>

    <fieldset>
        <legend>Contact</legend>

        Email:
        <input type="email" id="email" oninput="saveFormData()">
        <span class="error"></span><br><br>

        Phone:
        <input type="tel" id="phone" oninput="saveFormData()">
        <span class="error"></span>
    </fieldset>

    <fieldset>
        <legend>Address</legend>

        Address:
        <input type="text" id="addr1" oninput="saveFormData()"><br><br>

        City:
        <input type="text" id="city" oninput="saveFormData()"><br><br>

        State:
        <select id="state"></select>
        <span class="error" id="errState"></span><br><br>

        Zip:
        <input type="text" id="zip" oninput="saveFormData()">
        <span class="error" id="errZip"></span>
    </fieldset>

    <br>

    <input type="checkbox" id="remember" checked>
    Remember Me

    <br><br>

    <input type="submit" value="Submit">
    <input type="reset" value="Reset">

</form>

</div>

<!-- iFRAME (REQUIRED FEATURE) -->
<div id="iframe-section">
    <iframe src="https://www.w3schools.com" width="100%" height="300"></iframe>
</div>

<!-- FOOTER -->
<div id="footer">
    We Care Medical Clinic © 2026
</div>

</body>
</html>
